set default=0
# Three seconds of menu, then the boot. The menu is how a flag gets onto one
# boot: `e`, the words on the `multiboot2` line, Ctrl-X (docs/wiki/boot.md has
# every flag).
# With the default timeout style a timeout of zero boots at once and reads no
# key, so SHIFT or ESC would not bring the menu up
set timeout=3

menuentry "MikuOS" {
    insmod all_video
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    boot
}
