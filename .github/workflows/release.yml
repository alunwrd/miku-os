name: MikuOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # rustc 1.98.0-nightly (cb46fbb8c 2026-06-08), the commit lib/sdk/rust-std is written against
  RUST_NIGHTLY: nightly-2026-06-09

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm xorriso mtools grub-pc-bin grub-common e2fsprogs

      # The builder calls `cargo +nightly`, so the pinned install takes that name
      - name: Install Rust nightly
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --no-self-update \
            -c rust-src -c llvm-tools -t x86_64-unknown-none
          toolchains="${RUSTUP_HOME:-$HOME/.rustup}/toolchains"
          mv "$toolchains/$RUST_NIGHTLY-x86_64-unknown-linux-gnu" \
             "$toolchains/nightly-x86_64-unknown-linux-gnu"
          rustup default nightly
          rustc -vV

      # Low RAM mode and the std programs: no. Later questions take their
      # defaults at end of input
      - name: Build the image
        working-directory: builder
        run: printf 'N\nN\n' | cargo run --release

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: miku-os/miku-os.iso
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## MikuOS ${{ github.ref_name }}

            `miku-os.iso` is a bootable image with the whole system inside. BIOS only:
            under UEFI, GRUB's `multiboot2` faults, so real hardware has to boot it in
            legacy mode (CSM).

            **Running**
            ```bash
            qemu-system-x86_64 -enable-kvm -cpu host -smp 4 -m 4G \
              -boot d -cdrom miku-os.iso \
              -serial stdio \
              -netdev user,id=n0 -device virtio-net-pci,netdev=n0
            ```
            Or write it to a USB stick:
            ```bash
            sudo dd if=miku-os.iso of=/dev/sdX bs=4M status=progress conv=fdatasync
            ```

            Log in as `miku`, password `miku`.

            **Not in this image**
            - NVIDIA firmware. The GSP/FWSEC/ACR blobs are NVIDIA's to distribute, so
              the GPU driver reports `firmware unavailable`. See
              `kernel/drivers/gpu/nvidia/firmware/README.md` for a local build with them.
            - GPU programs (blur, shadows, aosh's painter), which need the CUDA toolkit.
              The desktop draws on the processor.
