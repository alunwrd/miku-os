# The commands
#
# `ls`, `cat`, `rm`, `mv` and the rest of what a person types at a prompt. Each
# acts on a path somebody typed, so a mistake is made with the caller's
# credential rather than the kernel's, and `ls` is a file in /bin that can be
# replaced.
#
# The kernel keeps what needs ring 0: `dd`, `mount`, `df`, the ext tools, the
# block layer, `mkfs`, `nvidia`, the selftests. Those have no twin here.
#
# Built for `x86_64-miku-app` like `system/` and `apps/`; the target spec and
# the linker script live in `lib/miku/`, shared with both.
[package]
name    = "miku-utils"
version = "0.2.10"
edition = "2021"

[workspace]

[dependencies]
miku = { path = "../lib/miku" }
# `/etc/passwd` and `/etc/group`, so `ls -l` and `ps` can say `miku` where the
# filesystem says 1000. Without the `userspace` feature it is the pure-parser
# half of the crate, the same code `login` and `mikudod` use, host-tested in
# `cargo test`
mikuauth = { path = "../lib/mikuauth" }

[profile.release]
opt-level = "z"
lto = true

[[bin]]
name = "ls"
path = "src/ls.rs"

[[bin]]
name = "cat"
path = "src/cat.rs"

