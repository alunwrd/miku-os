<?xml version="1.0" encoding="UTF-8"?>
<!-- Transforms on groups and shapes, nested, every kind, and use -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="48" height="48">
  <defs>
    <path id="tri" d="M0 0 L8 0 L4 7 Z" fill="#27ae60"/>
  </defs>
  <g transform="translate(4,4)">
    <rect width="10" height="10" fill="#2980b9" transform="rotate(15 5 5)"/>
    <g transform="scale(1.5) translate(10, 0)">
      <rect width="6" height="6" fill="#c0392b"/>
    </g>
  </g>
  <g transform="matrix(1 0 0.3 1 0 0)">
    <rect x="20" y="20" width="8" height="8" fill="#f39c12"/>
  </g>
  <rect x="34" y="4" width="8" height="8" fill="#8e44ad" transform="skewY(20)"/>
  <use xlink:href="#tri" x="4" y="34"/>
  <use href="#tri" transform="translate(30 34) rotate(-30)"/>
  <!-- Numbers run together, as breeze's mimetypes write them -->
  <g transform="translate(-384.57-515.8)">
    <rect x="398.57" y="555.8" width="4" height="4" fill="#d35400"/>
  </g>
  <g transform="translate(20 46) scale(1-1)">
    <rect width="4" height="3" fill="#2c3e50"/>
  </g>
  <g opacity="0.5" fill="#16a085">
    <circle cx="40" cy="22" r="5"/>
    <circle cx="44" cy="26" r="4" opacity="0.5"/>
  </g>
</svg>
