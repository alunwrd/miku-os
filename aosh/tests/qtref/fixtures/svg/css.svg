<?xml version="1.0" encoding="UTF-8"?>
<!-- Style sheets: classes, an id, an element, the style attribute over both
     and over a presentation attribute; currentColor from a class and from
     an inherited colour -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text { color: #31363b; }
      .ColorScheme-Highlight { color:#3daee9; }
      #special { fill: #da4453 }
      circle { fill: #27ae60; }
    </style>
  </defs>
  <path class="ColorScheme-Text" style="fill:currentColor;fill-opacity:1;stroke:none" d="M3 3 h7 v7 h-7 z"/>
  <path class="ColorScheme-Highlight" fill="currentColor" d="M12 3 h7 v7 h-7 z"/>
  <rect id="special" x="3" y="12" width="7" height="7" fill="#000000"/>
  <g color="#f67400"><rect x="12" y="12" width="3" height="7" fill="currentColor"/></g>
  <circle cx="17" cy="15.5" r="2" style="fill:#1d99f3"/>
  <circle cx="17" cy="20" r="1.5"/>
</svg>
