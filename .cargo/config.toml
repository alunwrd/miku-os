[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# force-frame-pointers: a backtrace needs a frame chain to walk. Without it a
# panic prints one address and stops
rustflags = ["-C", "link-arg=-Tlinker.ld", "-C", "link-arg=--no-dynamic-linker", "-C", "relocation-model=static", "-C", "force-frame-pointers=yes"]

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
