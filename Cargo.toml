[workspace]
# `builder` is excluded rather than a member, as `lib/net/Cargo.toml` explains:
# as a member it shares the root's resolution, and the root resolves for
# `build-std`, so a dependency gets compiled against the sysroot `core` and
# against the one built from source, and the link fails on a duplicate `sized`
# lang item. It is invoked as `cd builder && cargo run`
members  = ["lib/ld-miku", "lib/mayland", "lib/miku", "lib/vdso"]
exclude  = ["builder", "lib/net", "lib/extfs", "lib/fshost", "lib/btrfs", "lib/mikuauth", "lib/mikupkg", "lib/libmiku/hosttest", "kernel/mm/heap/hosttest"]
resolver = "2"

[package]
name        = "miku-os-release"
license = "Apache-2.0"
version     = "1.0.0"
edition     = "2021"
authors     = ["alunwrd"]
description = "Experimental OS in Rust"
repository  = "https://github.com/alunwrd/miku-os"

[[bin]]
name = "miku-os-release"
path = "kernel/main.rs"

[features]
default = []

[dependencies]
# The display protocol, shared with every program that draws. A crate rather
# than `#[path]` includes, so there is one encoder and the build can tell when
# it changed
libmay               = { path = "lib/mayland" }
# The network stack, L2-L4. The same crate the host tests run against (`cd
# lib/net && cargo test`). `stack` is on by default; `userspace` is not, so
# `miku` is not pulled in
#
# `default-features = false, features = ["stack"]` and not the default set: the
# kernel speaks no TLS, and the default carries `crypto` (the ASN.1 reader, the
# X.509 parser, the bignum arithmetic and RSA), which does not belong in ring 0
mikunet              = { path = "lib/net", default-features = false, features = ["stack"] }
# The ext2/3/4 on-disk format, as a library rather than kernel modules. Same
# arrangement as `mikunet`: everything in it is pure format handling over a
# trait, so `cd lib/extfs && cargo test` reaches the superblock, the extent
# trees, the allocator and the journal without a boot
extfs                = { path = "lib/extfs" }
# The seam both format crates take: the block host, MemDisk and crc32c
fshost               = { path = "lib/fshost" }
# btrfs, read-only (dev/fs-architecture.md)
btrfs                = { path = "lib/btrfs" }
volatile              = "0.2.6"
spin                  = "0.9.8"
x86_64                = "0.14.2"
noto-sans-mono-bitmap = "0.2"
log                   = "0.4"
lazy_static           = { version = "1.4.0", features = ["spin_no_std"] }
pc-keyboard           = "0.7.0"
pic8259               = "0.10.1"
# The VFS's directory-entry name hash (`kernel/fs/vfs/hash.rs`). Without `std`
# it is `#![no_std]`, allocates nothing and does no run-time CPU detection
hassh64               = { version = "2.1", default-features = false }

[build-dependencies]
# Build-time only: artwork goes in as a file and comes out as pixels. The font
# is `libmay`'s, so `fontdue` is its build-dependency
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.dev]
panic     = "abort"
opt-level = 1

[profile.release]
panic     = "abort"
opt-level = 2
lto       = true
