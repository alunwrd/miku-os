# mikuauth: who a user is, and who may become somebody else
#
# The password hash, the three files that describe the accounts on the machine,
# and the grammar of /etc/mikudo.conf. Everything here is a parser or a KDF and
# nothing here is I/O: a caller hands it bytes and gets back a decision.
#
# Privilege-escalation bugs tend to live in parsers: sudo's argv unescape
# (CVE-2021-3156), pkexec's argv walk (PwnKit), sudoers rules that matched
# something other than what they read as. So the parsers run on the build host,
# against the hostile corpus in tests/.
#
# Two ways to build it, as `mikunet` and `libmay` do:
#   default    pure computation. What `cargo test` builds, on the host, with
#              std available so a failing test can say what it was holding
#   userspace  adds the MikuOS syscall bindings for reading the files and
#              drawing entropy for a salt
[package]
name    = "mikuauth"
version = "0.1.0"
edition = "2021"

# Its own workspace, and `exclude`d by the repository root, as
# `lib/net/Cargo.toml` explains: as a member the crate would share the root's
# resolution, `core` would be built both from the sysroot and from source, and
# the link would fail on a duplicate `sized` lang item
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
miku = { path = "../../sdk/miku", optional = true }
miku-abi = { path = "../../abi" }
miku-base = { path = "../../base" }
mikucrypto = { path = "../../crypto" }

[features]
default   = []
userspace = ["dep:miku"]

[profile.release]
opt-level = 2
