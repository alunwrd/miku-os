# btrfs: the on-disk format, read-only
#
# Same shape as `lib/fs/extfs`: everything here is format and arithmetic over it,
# the disk arrives through `fshost::BlockHost`, and `cargo test` can build a
# volume, corrupt it and check what the driver does.
#
# Read-only: one `write()` must copy the fs-tree leaf and every node above it,
# allocate from the free-space tree, add an extent item with a backref, add
# checksum items, and land all of it in one transaction that flips a superblock
# generation. There is nothing smaller that is correct.
[package]
name    = "btrfs"
version = "0.1.0"
edition = "2021"

# Its own workspace, as `lib/fs/extfs`, `lib/fs/fshost` and `lib/net` explain: as a
# member the crate shares the root's resolution and a dependency ends up
# compiled against two different `core`s
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
fshost = { path = "../fshost" }

[profile.release]
opt-level = 2
