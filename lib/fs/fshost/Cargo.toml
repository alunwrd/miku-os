# fshost: what a filesystem needs from underneath it
#
# Nothing here knows about any filesystem: it is a disk addressed in 512-byte
# sectors, a clock, and the one checksum ext4 and btrfs share.
#
#   `BlockHost`  the seam. Four write methods and not one, because a journal
#                has to tell them apart
#   `MemDisk`    a disk with a volatile write cache and a `crash()`, which puts
#                crash consistency in `cargo test`
#   `crc32c`     ext4 sums every metadata block with it; btrfs sums every tree
#                node with it and hashes directory names with it
[package]
name    = "fshost"
version = "0.1.0"
edition = "2021"

# Its own workspace, as `lib/fs/extfs` and `lib/net` explain: as a member the crate
# shares the root's resolution, and a dependency then gets compiled against both
# the sysroot `core` and the one `build-std` builds from source, which fails on
# a duplicate lang item
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
miku-base = { path = "../../base" }

[profile.release]
opt-level = 2
