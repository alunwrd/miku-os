# extfs: the ext2/ext3/ext4 on-disk format, as a library rather than kernel
# modules
#
# The format and the algorithms over it: superblock and group descriptors,
# inodes, directory entries, allocation bitmaps, extent trees, the JBD2 journal
# and its replay, and the CRC32c that covers them. None of it needs privilege.
# The disk arrives through a trait rather than by calling the block layer
# directly.
#
# Above `host::ExtHost` is format; below it is whatever can read and write
# 512-byte sectors: the kernel's block layer in MikuOS, a `Vec<u8>` on the build
# host.
#
# With the disk behind a trait, `cargo test` builds a filesystem in memory,
# corrupts it and checks what the driver does.
[package]
name    = "extfs"
version = "0.1.0"
edition = "2021"

# Its own workspace, and `exclude`d by the repository root, even though the
# kernel links it, as in `lib/net`: as a member the crate shares the root's
# resolution, `spin` gets compiled against both the sysroot `core` and the one
# `build-std` builds from source, and the link fails on a duplicate `sized` lang
# item
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
fshost = { path = "../fshost" }

[features]
default = []

[profile.release]
opt-level = 2
