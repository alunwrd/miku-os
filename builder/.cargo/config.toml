# The builder is a host program: it runs on the machine doing the build, not on
# MikuOS. The workspace config one directory up targets x86_64-unknown-none and
# turns on build-std, and cargo merges parent configs into this one.
#
# Cargo unions these arrays with the parent's, so `build-std = []` changes
# nothing: the root's `["core", "compiler_builtins", "alloc"]` still applies,
# and a dependency saying `extern crate alloc` puts two `alloc`s in one link (a
# duplicate `owned_box` lang item).
#
# Hence `std` in the list, as in `lib/net`: everything comes from one source
# tree. It costs one slow first build and is cached after that.
[build]
target = "x86_64-unknown-linux-gnu"
# The root `target/` holds the kernel's build-std artifacts; a directory of its
# own stops the two meeting in a link
target-dir = "target"

[unstable]
build-std = ["std", "panic_unwind", "proc_macro", "test"]
build-std-features = []
