# /etc/mikudo.conf: who may become whom, to run what
#
#   permit|deny [options] identity [as target] [cmd path [args ...]]
#
#   identity   a user name, a uid, ':' and a group name, or ':' and a gid
#   options    nopass nolog persist keepenv setenv { KEY KEY=value }
#   path       an absolute path to a program, or `kernel:<name>` for one of
#              the machine's own commands (`nvidia`, `mount`, `mkfs.ext4`,
#              the block layer). Those live inside the kernel because each
#              needs ring 0, so they have no path; every real command here
#              is absolute, so `kernel:` cannot be mistaken for one
#
# Three rules:
#
#   * The last matching rule wins, not the most specific.
#   * No match is a denial. This file only grants.
#   * A syntax error anywhere denies everything until it is fixed, and is
#     reported on the console and in the journal.
#
# This file must be owned by root and must not be group- or world-writable.
# mikudod checks that on every read and refuses the file otherwise.
#
# There is no way to write "any command except X": `cmd !/bin/sh` is defeated by
# a copy of the program under another name, and by any program that starts a
# shell.

# Members of wheel may become anyone, after authenticating.
# `persist` remembers that for a few minutes, on this terminal only.
permit persist :wheel

# Examples:
#
#   # one command, no password, and only with exactly these arguments
#   permit nopass :wheel cmd /sbin/fstrim args /
#
#   # a service account that may restart one thing
#   permit nopass deploy as root cmd /bin/mikuctl args restart netd
#
#   # installing software, without the rest of root.
#   #
#   # `mikupkg` runs as whoever typed the command and does the parsing
#   # (network, container, index, /etc/mikupkg). It asks root for one program,
#   # which checks every package's signature against /etc/mikupkg/keys and
#   # hashes every staged file against the table that signature covers
#   permit :wheel as root cmd /bin/mikupkg-apply
#
#   # one of the machine's own commands, `list` only
#   permit nopass :wheel cmd kernel:nvidia args list
#
#   # mkfs refused, whatever the blanket rule above says
#   deny :wheel cmd kernel:mkfs.ext4
#
#   # keeps EDITOR and VISUAL, for a command that starts an editor
#   permit :wheel setenv { EDITOR VISUAL } cmd /bin/visudo
#
#   # takes back something the blanket rule above allows
#   deny :wheel cmd /bin/mkfs
