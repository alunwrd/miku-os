# What a graphical session is
#
# Read by `/bin/maysession`, which field seven of /etc/passwd names and mikudod
# starts, as the user, after a successful login. Everything listed here is
# started with CAP_MAY_PRIV: each binds a global the compositor does not give an
# ordinary client. Nothing started by them keeps it: `spawn::run` drops it, and
# aosh drops it from what it starts, so a program opened from the launcher
# cannot put a surface over the screen and read the keyboard.
#
# Files in this directory are read in name order and add to each other, so a
# `50-mine.conf` naming one more program does not repeat these three.
session {
    # The window manager, which holds may_wm: where windows go, how big they
    # are, and what the key bindings mean
    start = /bin/maywm

    # The shell (the bar and the launcher): /etc/aosh/shell.qml, or
    # ~/.config/aosh/shell.qml when there is one. aosh reads QML, as quickshell
    # does (dev/aosh-architecture.md)
    start = /bin/aosh

    # The terminal. It makes a terminal of its own and runs /bin/msh on it with
    # the user's identity.
    #
    # `mayterm console` draws the machine's console instead: uncomment the line
    # below to watch the boot log, a driver finding a disk or a panic. It
    # belongs here and not in `apps.d`: drawing the machine's text needs
    # `may_priv`, which a session gives its own programs and `spawn::run` drops
    # from anything started from the launcher
    start = /bin/mayterm
    # start = /bin/mayterm console

    # The one whose exit ends the session: with the window manager gone nothing
    # can log out, and an open session would hold the seat while showing
    # nothing.
    #
    # Without this line the session ends when the first program listed does
    main = /bin/maywm
}
