# The head of the desktop's config. There are three layers, read in this order,
# and the later line wins:
#
#     /etc/mayland/default.d/*.conf   what the build ships
#     /etc/mayland/may.conf           this file
#     /etc/mayland/conf.d/*.conf      local files
#
# Inside a directory, files are read in name order (hence the `10-`, `50-`,
# `99-` prefixes).
#
# Two programs read it: `/bin/maywm` takes the layout, the rules and the keys,
# and `/bin/aosh` (the bar and the launcher) takes the palette from
# 10-theme.conf. Each skips the blocks it does not own.
#
# A line neither of them understands is reported on the console with its file
# and line number, and so are two files of the same layer setting one thing.
#
# Every keyword, dispatcher and window rule is listed in /etc/mayland/REFERENCE,
# which nothing parses.
#
# What to edit
#
# The build rewrites default.d on every image. Local files go in conf.d, where
# nothing is shipped. A file in conf.d with the same name as one in default.d
# replaces it, so an empty conf.d/50-keys.conf switches off every key binding
# the build ships.
#
# This file is in the middle layer: it beats the shipped files and loses to
# conf.d.

# Variables. Collected from every file of every layer before any line is read,
# so this reaches the shipped bindings although they are read first, and a `$mod
# = ALT` in conf.d/ beats this one. A value may not contain a variable, so a
# cycle cannot be written
$mod = SUPER
