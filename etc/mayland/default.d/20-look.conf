# The shape of a window and the space around it
general {
    # The same numbers as `~/.config/hypr`.
    #
    # `gaps_in` is the space between windows and `gaps_out` the space between a
    # window and the edge of the screen.
    #
    # The outer gap shows the wallpaper, so a picture with a bright edge puts a
    # bright line down the side of the screen
    gaps_in = 4
    gaps_out = 4
    layout = dwindle
    # One pixel, in the colours matugen made of the wallpaper (from a running
    # Hyprland). Translucent, so the border is blended, curve and all
    # (`dev/mayland-window-shape.md`)
    border_size = 1
    col.active_border = rgba(41484d77)
    col.inactive_border = rgba(181c2033)
}

decoration {
    # 22 at power 2.5 is a squircle, drawn 27.5 pixels round as in Hyprland: the
    # radius is `rounding · power / 2`
    rounding = 22
    rounding_power = 2.5
    # Every window but the active one at 90%, and darkened by 5%
    active_opacity = 1.0
    inactive_opacity = 0.9
    dim_inactive = true
    dim_strength = 0.05
    # For the shell's layers; windows are not blurred (`60-rules.conf`)
    blur {
        enabled = true
        size = 8
    }
}

dwindle {
    split_ratio = 1.0
}
