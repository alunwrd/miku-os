# What the desktop is drawn in
#
# The one file both programs read: `maywm` takes the border colours from it and
# `aosh` paints the bar and the launcher from it (`Theme`).
#
# Named by part rather than by hue, so a swapped palette keeps its meaning.
# Written as in hyprland.conf (rgb(), rgba() or 0x) and not as #rrggbb, since a
# hash starts a comment: `page = #0f0d13` is the line `page =`
#
# Alpha
#
# `rgba(RRGGBBAA)`: the bar is a surface the compositor blends over the
# wallpaper, so an alpha here is see-through and not a darker shade. A colour
# without one (`rgb()` or six digits) is solid.
theme {
    # The picture behind everything, or no line at all for the gradient.
    #
    # Pictures live in /etc/mayland/wallpapers/. The build converts anything in
    # `assets/wallpapers/` (PNG, JPEG) into QOI, the one format this machine
    # decodes.
    #
    # The compositor covers the screen with it and crops what hangs over the
    # edges.
    wallpaper  = /etc/mayland/wallpapers/miku.qoi

    # `page` is what a full-screen program is drawn on. The bar does not use it:
    # its strip is see-through, and what fills it is the card below
    page       = rgb(0f0d13)

    # The bar's own colour. Three quarters alpha: text reads against a bright
    # photograph and the wallpaper still shows
    card       = rgba(211f24bf)
    accent     = rgba(cfbdfeee)
    on_accent  = rgb(141218)
    text       = rgb(e6e1e9)
    text_muted = rgb(948f99)
    border     = rgb(2b292f)
}
