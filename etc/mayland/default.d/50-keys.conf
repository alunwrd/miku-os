# Key bindings
#
# `$mod` is defined in may.conf, which is read after this file, and still
# reaches these lines: every `$name = value` in every file is collected before
# any line is dispatched. A `$mod = ALT` in a drop-in moves every binding here.
bind = $mod, Return, exec, /bin/mayterm
# Zed, from the `zed` package; without it this key starts nothing. A chord the
# window manager binds never reaches a program, so ^W does not erase a word in a
# shell or close a tab in Zed
bind = CTRL, W, exec, /bin/zed
# The launcher is aosh's (/etc/aosh/Launcher.qml): the word is a call,
# `launcher.toggle()`, the same one `aosh ipc call launcher toggle` makes
bind = $mod, D, signal, launcher toggle
bind = $mod, Q, killactive
bind = $mod SHIFT, F, togglefloating
bind = $mod, F, fullscreen
bind = $mod, P, pin
bind = $mod, M, layout
bind = $mod, C, centerwindow
# Reads the config again and applies it, like `hyprctl reload`. Every file of
# every layer is re-read, so a drop-in added since boot is picked up and one
# deleted since boot goes away
bind = $mod SHIFT, R, reload
bind = $mod, Left,  movefocus, left
bind = $mod, Right, movefocus, right
bind = $mod, J, movefocus, next
bind = $mod, K, movefocus, prev
bind = $mod SHIFT, Left,  swapwindow, left
bind = $mod SHIFT, Right, swapwindow, right

# The pointer moves or resizes a window. A mouse button is an ordinary key here:
# evdev numbers buttons above every keyboard key, so `mouse:272` needs no
# mechanism of its own
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow

# Workspaces are on Ctrl and not on Super: under a virtual machine the Super key
# belongs to the outer window manager, so the chord never arrives. Everything
# else stays on Super
bind = CTRL, 1, workspace, 1
bind = CTRL, 2, workspace, 2
bind = CTRL, 3, workspace, 3
bind = CTRL, 4, workspace, 4
bind = CTRL, 5, workspace, 5
bind = CTRL, 6, workspace, 6
bind = CTRL, 7, workspace, 7
bind = CTRL, 8, workspace, 8
bind = CTRL, 9, workspace, 9
bind = CTRL, 0, workspace, 10
# Back to the previous one, and on to the next one with anything on it
bind = $mod, TAB, workspace, previous
bind = $mod SHIFT, TAB, workspace, e+1

bind = CTRL SHIFT, 1, movetoworkspace, 1
bind = CTRL SHIFT, 2, movetoworkspace, 2
bind = CTRL SHIFT, 3, movetoworkspace, 3
bind = CTRL SHIFT, 4, movetoworkspace, 4
bind = CTRL SHIFT, 5, movetoworkspace, 5
bind = CTRL SHIFT, 6, movetoworkspace, 6
bind = CTRL SHIFT, 7, movetoworkspace, 7
bind = CTRL SHIFT, 8, movetoworkspace, 8
bind = CTRL SHIFT, 9, movetoworkspace, 9
bind = CTRL SHIFT, 0, movetoworkspace, 10

# A key map of its own: inside it the arrows and H and L mean something else,
# and everything in the default map stays live. A submap with no way out is
# reported at startup, since it looks like the keyboard has stopped
bind = $mod, R, submap, resize
submap = resize
binde = , H, splitratio, -0.05
binde = , L, splitratio, 0.05
binde = , Left,  resizeactive, -40 0
binde = , Right, resizeactive, 40 0
binde = , Up,    resizeactive, 0 -40
binde = , Down,  resizeactive, 0 40
bind  = , Escape, submap, reset
bind  = , Return, submap, reset
submap = reset
