# How the machine behaves under a hand
#
# Seven of Hyprland's settings. The repeat pair goes to the keyboard
# controller's typematic as well as to the client: nothing in this kernel counts
# milliseconds for a held key. `accel_profile`, `kb_variant` and the touchpad
# settings are reported if written: there is no acceleration curve, no xkb and
# no touchpad
input {
    # The layouts Alt+Shift moves between, in order. `us` and `ru` are the
    # two this machine has tables for (`keymap::LAYOUTS`), and `ru` is xkb's
    # `ru(winkeys)`. Ctrl and every bind read the first one whatever is in use
    kb_layout  = us,ru
    kb_options = grp:alt_shift_toggle
    repeat_rate  = 30
    repeat_delay = 400
    # 1 gives the keyboard to whatever the pointer is over. Off, so a cursor
    # resting over another window does not take the keys
    follow_mouse = 0
    sensitivity = 0
    natural_scroll = false
}
