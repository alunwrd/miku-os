# Animations
#
# The curves are named here and referred to by name below, as in hyprland.conf.
# The wire carries them by number, and this is where the two are joined
animations {
    enabled = true
}
bezier = easeOut, 0.22, 1, 0.36, 1
bezier = easeIn,  0.64, 0, 0.78, 0
# From `~/.config/hypr/hyprland/general.lua`
bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
bezier = menu_decel,      0.1, 1, 0, 1
bezier = menu_accel,      0.52, 0.03, 0.72, 0.08
bezier = stall,           1, -0.1, 0.7, 0.85

animation = windows,    1, 4, easeOut, popin 80%
animation = windowsOut, 1, 3, easeIn,  popin 80%
animation = fade,       1, 4, easeOut
animation = workspaces, 1, 5, easeOut, slide
# A layer grows from 93% over 270 ms while its alpha comes up in 50, each on its
# own clock (`dev/mayland-layers-above.md`). The closing ones are configured
# too, though a layer does not animate out yet
animation = layersIn,      1, 2.7, emphasizedDecel, popin 93%
animation = layersOut,     1, 2.4, menu_accel,      popin 94%
animation = fadeLayersIn,  1, 0.5, menu_decel
animation = fadeLayersOut, 1, 2.7, stall
