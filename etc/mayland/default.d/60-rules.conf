# What happens to a window the first time it is seen
#
# A rule applies to one window, chosen by a match on its class, its title or
# whether it floats. The pattern is a substring, so `class:term` catches
# `xterm`, and `.*` is every window. A `floating:` rule runs again whenever the
# window starts or stops floating
windowrule = float, class:maydemo
windowrule = center, class:maydemo

# From `~/.config/hypr/hyprland/rules.lua`: no window is blurred (a translucent
# one shows the desktop sharp behind it) and a tiled window casts no shadow
windowrule = noblur, class:.*
windowrule = noshadow, floating:0

# The layers it gives no animation (`rules.lua`): search and overview, the
# action centre, polkit's prompt and the overlay appear at once, with only their
# own QML animating
layerrule = noanim, quickshell:overview
layerrule = noanim, quickshell:actionCenter
layerrule = noanim, quickshell:lockWindowPusher
layerrule = noanim, quickshell:overlay
layerrule = noanim, quickshell:polkit
