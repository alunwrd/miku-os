# The login screen
#
# Its own section, laid over `theme` rather than replacing it. Read that file
# first: this one only covers the screen before there is a desktop.
#
# Light while the desktop is dark. Without this file the greeter is dark like
# the rest of the machine.
#
# Every colour is solid. The screen covers the whole display and is committed
# opaque (`maygreet.rs`), so a colour with an alpha would be drawn over whatever
# the last frame left
greeter {
    # The page is the ground and the card is nearly the whole screen. They
    # differ by little, so the edge reads as a card and not as a border
    page       = rgb(eef1f8)
    card       = rgb(f7f8fb)
    border     = rgb(e2e6ee)

    text       = rgb(2b2b31)
    text_muted = rgb(8b8f99)

    # What a field is filled with. Not in `theme`: the desktop's fields sit on a
    # card that is already see-through and this one does not
    field      = rgb(eaedf4)

    # What the focus ring and the caret are drawn in. The buttons are not: Sign
    # in and Back are the same light button, filled from `card` and `text` as
    # `ui::button` fills a secondary one
    accent     = rgb(f0a8c0)
    on_accent  = rgb(3a3a42)

    # The portrait, drawn in the circle above the greeting. The build cuts it to
    # that circle (`lib/buildgen/qoigen.rs`), so nothing at runtime has to know
    # it is round. Without this line there is no circle
    image      = /etc/mayland/art/miku.qoi
}
