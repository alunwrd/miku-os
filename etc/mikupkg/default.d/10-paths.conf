# What the build ships for mikupkg
#
# Three layers, lowest authority first, as in /etc/mayland:
#
#   /etc/mikupkg/default.d/*.conf   this file, rewritten by every image
#   /etc/mikupkg/mikupkg.conf       this machine
#   /etc/mikupkg/conf.d/*.conf      local files; nothing is installed here
#
# Later wins, and within a directory the order is by name. A file in conf.d with
# the same name as one here replaces it, so an empty conf.d/10-paths.conf
# switches all of this off.
#
# An unknown line is reported with its file and line number. An unknown line
# inside a `repo` block stops the run: a repo block says whose signatures this
# machine believes, and an unknown intent is read as nothing.

# One directory, /pkg, rather than /etc/mikupkg/db: machine-written state stays
# apart from hand-edited configuration
db      = /pkg/db
cache   = /pkg/cache
journal = /pkg/journal

# The keys this machine believes. A package or index signed by any other is
# refused
keyring = /etc/mikupkg/keys

# An index older than this is stale even if it has not said so itself, so a
# repository that stops publishing an expiry stops being believed
max_index_age = 7d

# Off: a package replaced by an older one is usually an attack
allow_downgrade = false

# There is no repository yet.
#
# Packages are built by `cd builder && cargo run`, which writes them into
# target/pkgs/ and installs them into the image. A repository is declared like
# this:
#
# repo core {
#     url      = https://example/miku/core
#     key      = 0000000000000000
#     priority = 10
#     mirror   = https://mirror.example/miku/core
# }
